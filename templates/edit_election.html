<!DOCTYPE html>
<html>
<head>
    <title>Edit Election</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>

/* Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2) !important;
}

/* CARD */
.card {
    border-radius: 15px !important;
    background: rgba(255,255,255,0.15) !important;
    backdrop-filter: blur(10px);
    color: white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2) !important;
    animation: fadeIn 0.4s ease;
}

/* TITLE */
h3 {
    text-align: center;
}

/* LABEL */
.form-label {
    font-weight: 500;
}

/* INPUTS */
.form-control {
    border-radius: 8px !important;
    border: none !important;
    padding: 10px;
}

.form-control:focus {
    box-shadow: 0 0 6px rgba(255,255,255,0.8) !important;
}

/* BUTTONS */
.btn-primary {
    background: linear-gradient(45deg, #36d1dc, #5b86e5) !important;
    border: none;
    border-radius: 30px;
    padding: 10px 20px;
}

.btn-secondary {
    background: linear-gradient(45deg, #434343, #000000) !important;
    border: none;
    border-radius: 30px;
    padding: 10px 20px;
}

/* HOVER */
.btn:hover {
    transform: translateY(-2px);
    transition: 0.3s;
}

/* CONTAINER */
.container {
    margin-top: 80px;
}

/* ANIMATION */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
    
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="mb-4">Edit Election</h3>

        <form method="POST">

            <!-- Election Name -->
            <div class="mb-3">
                <label class="form-label">Election Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ election.name }}"
                       required>
            </div>

            <!-- Start Date -->
            <div class="mb-3">
                <label class="form-label">Start Date</label>
                <input type="date"
                       name="start_date"
                       class="form-control"
                       value="{{ election.start }}"
                       required>
            </div>

            <!-- End Date -->
            <div class="mb-3">
                <label class="form-label">End Date</label>
                <input type="date"
                       name="end_date"
                       class="form-control"
                       value="{{ election.end }}"
                       required>
            </div>

            <!-- Buttons -->
            <button type="submit" class="btn btn-primary">
                Update Election
            </button>

            <a href="{{ url_for('admin_dashboard') }}"
               class="btn btn-secondary">
               Cancel
            </a>

        </form>
    </div>
</div>

</body>
</html>
