<!DOCTYPE html>
<html>
<head>
    <title>PIN Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        /* Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CONTAINER */
.pin-box {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 35px;
    border-radius: 15px;
    text-align: center;
    color: white;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: fadeIn 0.4s ease;
}

/* HEADINGS */
h2 {
    margin-bottom: 10px;
}

h3 {
    font-weight: 400;
    margin-bottom: 20px;
}

/* ERROR */
.error {
    color: #ff6b6b;
    margin-bottom: 10px;
    font-size: 14px;
}

/* INPUT */
input {
    width: 100%;
    padding: 12px;
    border-radius: 30px;
    border: none;
    text-align: center;
    font-size: 16px;
    margin-bottom: 15px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

/* HOVER */
button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}
    </style>
</head>
<body>
    <div class="pin-box">
    <h2>Face Verification failed</h2>
    <h3>Enter PIN to continue</h3>

    {% if error %}
     <p class="error">{{ error }}</p>

    {% endif %}

    <form method="POST">
        <input type="password" name="pin" placeholder="Enter PIN" required><br><br>
        <button type="submit">Verify PIN</button>
    </form>
    </div>
</body>
</html>
