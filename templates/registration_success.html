<!DOCTYPE html>
<html>
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
        <style>
            /* Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CONTAINER */
.success-box {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    color: white;
    width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: fadeIn 0.5s ease;
}

/* TITLE */
h2 {
    margin-bottom: 10px;
}

/* VOTER ID */
.voter-id {
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    background: rgba(0,0,0,0.2);
    padding: 10px;
    border-radius: 8px;
    margin: 15px 0;
    letter-spacing: 1px;
}

/* WARNING */
.warning {
    color: #ffeaa7;
    font-size: 14px;
    margin-bottom: 20px;
}

/* BUTTON LINK */
a {
    display: inline-block;
    text-decoration: none;
    padding: 12px 25px;
    border-radius: 30px;
    background: linear-gradient(45deg, #36d1dc, #5b86e5);
    color: white;
    font-weight: 500;
    transition: 0.3s;
}

a:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}
/* COPY BUTTON */
.copy-btn {
    margin-top: 10px;
    padding: 10px 20px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(45deg, #ff9a9e, #fad0c4);
    color: #333;
    font-weight: 500;
    cursor: pointer;
    transition: 0.3s;
}

.copy-btn:hover {
    transform: scale(1.05);
}
        </style>
        </head>
    <body>
        <div class="success-box">

<h2>Registration Successful!</h2>

<div class="voter-id" id="voterId">{{ voter_id }}</div>

<button onclick="copyID()" class="copy-btn">Copy Voter ID</button>

<p class="warning">
⚠ Please save this Voter ID carefully.
You will need it to login.
It will NOT be shown again.
</p>

<a href="{{ url_for('face_register', voter_id=voter_id) }}">
Continue to Face Registration
</a>

</div>
<script>
function copyID() {
    const text = document.getElementById("voterId").innerText;
    navigator.clipboard.writeText(text);

    alert("Voter ID copied to clipboard!");
}
</script>
</body>
</html>
